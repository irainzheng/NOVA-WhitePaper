# NOVA macro simulation baseline — whitepaper 21.7
version: "1.5"

npt:
  daily_earn_cap_per_user: 50
  consume_destroy_rate_median: 0.50
  monthly_nvc_convert_cap: 5000

agents:
  contributor_ratio:
    phase0: 0.05
    phase1: 0.08
    phase2: 0.12
    phase3: 0.15
  dau_growth:
    phase0_end: 5000
    phase1_end: 50000
    phase2_end: 500000

