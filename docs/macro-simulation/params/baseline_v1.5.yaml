# V1.5 additions — sensitivity toggles for nova_macro.py
scenarios:
  neutral:
    penetration: 0.01
    arpu_usd: 500
  optimistic:
    penetration: 0.05
    arpu_usd: 500
  pessimistic:
    penetration: 0.005
    arpu_usd: 300
